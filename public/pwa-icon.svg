<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#dzGrad)" />
  
  <!-- Inner Golden Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#fbbf24" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Central Emblem Shield -->
  <g filter="url(#shadow)">
    <!-- Crescent & Star (Algerian Motif) -->
    <path d="M 270 140 A 110 110 0 1 0 320 330 A 90 90 0 1 1 270 140 Z" fill="#ffffff" />
    <polygon points="320,210 329,238 358,238 335,255 344,282 320,265 296,282 305,255 282,238 311,238" fill="#ef4444" />
  </g>

  <!-- Typography: DZ & Khedma -->
  <text x="256" y="385" font-family="'Cairo', Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    KHEDMA DZ
  </text>
  
  <text x="256" y="440" font-family="'Cairo', Arial, sans-serif" font-size="34" font-weight="700" fill="#fbbf24" text-anchor="middle">
    خدمة ديزاد · 58 ولاية
  </text>
</svg>
